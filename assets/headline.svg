<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title">
  <title id="title">I turn people data into decisions leaders can trust. Measurement · Applied ML · AI Adoption · R, Python, SQL</title>
  <style>
    :root { --paper:#f7f4ef; --ink:#242424; --berry:#b11f4b; }
    @media (prefers-color-scheme:dark) { :root { --paper:#1d1b1e; --ink:#f4efe8; --berry:#ee96b1; } }
    .paper { fill:var(--paper); } .berry { fill:var(--berry); }
    .h1 { font:600 34px Georgia,'Lora',serif; fill:var(--ink); }
    .h2 { font:400 22px 'Segoe UI',Helvetica,Arial,sans-serif; fill:var(--ink); opacity:.85; }
  </style>
  <rect width="1200" height="140" class="paper"/>
  <g transform="translate(60 40)"><text class="h1" x="0" y="34" opacity="0">I turn people data into decisions leaders can trust.<animate attributeName="opacity" from="0" to="1" dur="2.8s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="2.8s" begin="0.3s" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1" fill="freeze"/></text></g>
  <g transform="translate(60 84)"><text class="h2" x="0" y="22" opacity="0">Measurement · Applied ML · AI Adoption · R, Python, SQL<animate attributeName="opacity" from="0" to="1" dur="2.8s" begin="2s" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" dur="2.8s" begin="2s" calcMode="spline" keyTimes="0;1" keySplines="0.3 0 0.2 1" fill="freeze"/></text></g>
</svg>
