  <g transform="translate(60 40)"><g clip-path="url(#c1)"><text class="h1" x="0" y="34">I turn people data into decisions leaders can trust.</text></g><rect x="0" y="0" width="3" height="34" class="berry" opacity="0"><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.01;0.99;1" dur="1.6s" begin="0.3s" fill="freeze"/><animate attributeName="x" values="0;960" dur="1.6s" begin="0.3s" fill="freeze"/></rect></g>
  <g transform="translate(60 84)"><g clip-path="url(#c2)"><text class="h2" x="0" y="22">Surveys · Measurement · AI readiness · R, Python, SQL</text></g></g>
