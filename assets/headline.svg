<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="title">
  <title id="title">I turn people data into decisions leaders can trust. Surveys · Measurement · AI readiness · R, Python, SQL</title>
  <style>
